            - btnResendRecoveryCode:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =Self.Color
                  BorderThickness: =1
                  Color: =RGBA(13, 50, 61, 1)
                  DisabledBorderColor: =ColorFade(Self.BorderColor, -10%)
                  DisabledColor: =RGBA(99, 139, 44, 1)
                  DisabledFill: =ColorFade(Self.Fill, 20%)
                  DisplayMode: =//If(IsBlank(LoginPassword.Text) || IsBlank(LoginUsername.Text), DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(255, 255, 255, 1)
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =55
                  HoverBorderColor: =ColorFade(Self.BorderColor, -10%)
                  HoverColor: =RGBA(99, 139, 44, 1)
                  HoverFill: =ColorFade(Self.Fill, -2%)
                  OnSelect: |
                    =Set(
                        gblIDUserToBeRecovered,
                        LookUp(
                            LoginDemo,
                            EmailAddress = txtRecoveryEmailAddress.Text
                        ).ID
                    );

                    Set(
                        gblNameUserToBeRecovered,
                        LookUp(
                            LoginDemo,
                            EmailAddress = txtRecoveryEmailAddress.Text
                        ).Titre
                    );

                    Set(
                        gblTimeCodeWasSent,
                        Now()
                    );

                    Set(
                        gblRecoveryCodeSent,
                        RandBetween(111111, 999999)
                    );

                    Office365Outlook.SendEmailV2(
                        txtRecoveryEmailAddress.Text,
                        "Complete Registration",
                        "<div style='background-color: #f5f5f5; width: 650px; height: 400px; border: 2px solid black; padding-bottom: 30px; font-weight:600; color: #0c5c00'>
                            <div style='background-color: #638b2c; height: 60px; text-align: center; color: #f5f5f5; font-weight: 900; padding: 15px; font-size: 2em; font-family: Trebuchet MS'>
                                RESET PASSWORD
                            </div>
                            <div style='font-size: 2em; font-family: Trebuchet MS; padding: 20px; background-color: #f5f5f5; color: #057f3f'>
                                <br> Hello " & gblNameUserToBeRecovered & ",<br><br> Please complete your account registration using the code below.
                                <div style='background-color: #f5f5f5; height: 60px; text-align: center; color: #057f3f; font-weight: 900; padding: 15px; font-size: 2em; font-family: Trebuchet MS'>
                                    " & gblRecoveryCodeSent & "
                                </div>
                            </div>
                        </div>",
                        {
                            Importance: "Normal",
                            IsHtml: true
                        }
                    );

                    Reset(txtRecoveryEmailAddress)
                  PressedBorderColor: =ColorFade(Self.BorderColor, -10%)
                  PressedColor: =RGBA(99, 139, 44, 1)
                  PressedFill: =ColorFade(Self.Fill, -1%)
                  RadiusBottomLeft: =5
                  RadiusBottomRight: =5
                  RadiusTopLeft: =5
                  RadiusTopRight: =5
                  Size: =12
                  Text: ="Resend Code"
                  Tooltip: =If(IsBlank(txtLoginPassword.Text) || IsBlank(txtLoginUsername.Text), "All fields are required")
                  Width: =500
