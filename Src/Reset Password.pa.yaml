            - HtmlText1_17:
                Control: HtmlViewer@2.1.0
                Properties:
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  Font: =Font.'Open Sans'
                  Height: =85
                  HtmlText: |-
                    =If(
                        gblShowErrorImage,
                        "<div style= 'padding:5px;height:60px; width: " & Parent.Width & "px;  text-align:center; font-size:4em; font-family: Trebuchet MS; font-weight:300'>☹️</div>",
                        ""
                    )
                  PaddingBottom: =0
                  PaddingTop: =0
                  Width: =500
            - btnConfirmRecoveryCode:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =Self.Fill
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =ColorFade(Self.Fill, -10%)
                  DisabledColor: =RGBA(255, 255, 255, 1)
                  DisabledFill: =ColorFade(Self.Fill, 20%)
                  DisplayMode: |-
                    =If(
                        IsBlank(txtRecoveryCode.Text) || Len(txtNewPassword.Text) < 14 || Len(txtConfirmNewPassword.Text) < 14,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =RGBA(13, 50, 61, 1)
                  Font: =Font.'Open Sans'
                  Height: =55
                  HoverBorderColor: =ColorFade(Self.Fill, -10%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(Self.Fill, -10%)
                  OnSelect: "=Set(\n    RecoveryCodeExpired,\n    If(\n        DateDiff(\n            gblTimeCodeWasSent,\n            Now(),\n            TimeUnit.Minutes\n        ) > 5,\n        true,\n        false\n    )\n);\nSet(\n    RecoveryCodeError,\n    If(\n        Value(txtRecoveryCode.Text) <> gblRecoveryCodeSent,\n        true,\n        false\n    )\n);\nSet(\n    gblRecoveryPasswordDontMatch,\n    If(\n        txtNewPassword.Text <> txtConfirmNewPassword.Text,\n        true,\n        false\n    )\n);\nClearCollect(\n    colCheckNumbers,\n    ForAll(\n        Split(\n            txtNewPassword.Text,\n            \"\"\n        ),\n        If(\n            IsMatch(\n                Value,\n                \"[0-9]\"\n            ),\n            Value,\n            \"\"\n        )\n    )\n);\nClearCollect(\n    colCheckCapitalLetters,\n    ForAll(\n        Split(\n            txtNewPassword.Text,\n            \"\"\n        ),\n        If(\n            IsMatch(\n                Value,\n                \"[A-Z]\"\n            ),\n            Value,\n            \"\"\n        )\n    )\n);\nClearCollect(\n    colCheckSmallLetters,\n    ForAll(\n        Split(\n            txtNewPassword.Text,\n            \"\"\n        ),\n        If(\n            IsMatch(\n                Value,\n                \"[a-z]\"\n            ),\n            Value,\n            \"\"\n        )\n    )\n);\nClearCollect(\n    colCheckSymbol,\n    ForAll(\n        Split(\n            txtNewPassword.Text,\n            \"\"\n        ),\n        If(\n            IsMatch(\n                Value,\n                \"[@,#,$,%,&,?,>,<]\"\n            ),\n            Value,\n            \"\"\n        )\n    )\n);\nUpdateContext(\n    {\n        locNewPasswordError: (CountRows(\n            Filter(\n                colCheckNumbers,\n                Value\n            )\n        ) = 0 || CountRows(\n            Filter(\n                colCheckCapitalLetters,\n                Value\n            )\n        ) = 0 || CountRows(\n            Filter(\n                colCheckSmallLetters,\n                Value\n            )\n        ) = 0 || CountRows(\n            Filter(\n                colCheckSymbol,\n                Value\n            )\n        ) = 0)\n    }\n);\nIf(\n    locNewPasswordError,\n    Notify(\n        \"Password must be a combination of uppercase letters, lowercase letters, numbers and any of these symbols !@#$%^&*>?\",\n        NotificationType.Error,\n        3000\n    ),\n    If(\n        RecoveryCodeExpired,\n        false;\n        Notify(\n            \"Code has expired. Click resend for another code\",\n            NotificationType.Error,\n            4000\n        ),\n        If(\n            RecoveryCodeError,\n            false;\n            Notify(\n                \"Incorrect code. Try again\",\n                NotificationType.Error,\n                4000\n            ),\n            If(\n                gblRecoveryPasswordDontMatch,\n                false;\n                Notify(\n                    \"Passwords do not match. Please try again\",\n                    NotificationType.Error,\n                    4000\n                ),\n                If(\n                    locNewPasswordError,\n                    false;\n                    Notify(\n                        \"Password must be a combination of uppercase letters, lowercase letters, numbers and any of these symbols !@#$%^&*>?\",\n                        NotificationType.Error,\n                        4000\n                    )\n                )\n            )\n        )\n    )\n);\nIf(\n    RecoveryCodeExpired = false And RecoveryCodeError = false And locNewPasswordError = false And gblRecoveryPasswordDontMatch = false,\n    Patch(\n        LoginDemo,\n        {ID: gblIDUserToBeRecovered},\n        {Password: txtNewPassword.Text}\n    );\n    Notify(\n        \"Password change successful. Please login with new password\",\n        NotificationType.Success,\n        4000\n    );\n    Navigate(\n        HomeScreen,\n        ScreenTransition.Fade\n    );\n    Reset(txtRecoveryCode);\n    Reset(txtNewPassword);\n    Reset(txtConfirmNewPassword);\n    Reset(txtRecoveryEmailAddress);\n    \n)"
