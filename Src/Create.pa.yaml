            Y: =Con_DashboardHeader_Create.Y + Con_DashboardHeader_Create.Height
          Children:
            - Con_CreateBooking:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(44, 44, 44, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
