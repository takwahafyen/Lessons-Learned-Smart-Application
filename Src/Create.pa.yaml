            DropShadow: =DropShadow.None
            Height: =If(IsMobileLayout,Parent.Height-Con_DashboardHeader_Create.Height,Parent.Height-Con_DashboardHeader_Create.Height)
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =If(IsMobileLayout,Parent.Width,Parent.Width-Cmp_SideNav_Create.Width)
