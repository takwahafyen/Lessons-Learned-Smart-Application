                                  Children:
                                    - Con_TxtSelectMonthandDate:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =Parent.Height
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          PaddingLeft: =10
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =If(IsMobileLayout || IsTabletLayout ,150,220)
                                        Children:
                                          - Lbl_View:
                                              Control: Text@0.0.51
                                              Properties:
                                                Align: ='TextCanvas.Align'.Start
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                FontColor: =RGBA(252, 194, 27, 1)
                                                Size: =If(IsMobileLayout || IsTabletLayout ,12,18)
                                                Text: |-
                                                  =Switch(
                                                      CurrentView,
                                                      "ViewCalender",
                                                      "Select Month and Date",
                                                      "ViewCars",
                                                      "Select a Project",
                                                      "ViewOccupant",
                                                      "Occupants and Category",
                                                      "Summary",
                                                      "Lesson Summary",
                                                      "ViewTime",
                                                      "Select Time",
                                                      "ViewInfo",
                                                      "Additonal Information",
                                                      "PeoplePicker",
                                                      "Select Occupants"
                                                  )
                                                Weight: ='TextCanvas.Weight'.Bold
                                                Width: =Parent.Width
                                    - Con_FilterDropDownMonth:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          Height: =Parent.Height
                                          LayoutDirection: =LayoutDirection.Vertical
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =CurrentView = "ViewCalender"
                                        Children:
                                          - Con_FilterDropdown:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.End
                                                DropShadow: =DropShadow.None
                                                Height: =Parent.Height
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                PaddingBottom: =10
                                                PaddingLeft: =10
                                                PaddingRight: =10
                                                PaddingTop: =10
                                                Width: =If(IsMobileLayout,200, 400)
                                              Children:
                                                - MonthDropDown:
                                                    Control: DropDown@0.0.45
                                                    Properties:
                                                      Appearance: ='DropdownCanvas.Appearance'.Outline
                                                      BasePaletteColor: =RGBA(189, 178, 176, 1)
                                                      DefaultSelectedItems: =First(Filter(MonthsCollection, IsCurrent))
                                                      Items: =MonthsCollection
                                                      LayoutMinWidth: =50
                                                      OnChange: |-
                                                        =Set(
                                                            SelectedMonth,
                                                            MonthDropDown.Selected.MonthNumber
                                                        );

                                                        ClearCollect(
                                                            CalendarDays,
                                                            ForAll(
                                                                Sequence(
                                                                    Date(Year(Today()), SelectedMonth + 1, 1) - Date(Year(Today()), SelectedMonth, 1)
                                                                ),
                                                                {
                                                                    DayNumber: Value,
                                                                    DayDate: Date(Year(Today()), SelectedMonth, Value),
                                                                    DayName: Text(Date(Year(Today()), SelectedMonth, Value), "dddd"),
                                                                    IsToday: Date(Year(Today()), SelectedMonth, Value) = Today(),
                                                                    IsDisabled: Or(
                                                                        Date(Year(Today()), SelectedMonth, Value) < Today(),
                                                                        Weekday(Date(Year(Today()), SelectedMonth, Value)) = 1,
                                                                        Weekday(Date(Year(Today()), SelectedMonth, Value)) = 7
                                                                    )
                                                                }
                                                            )
                                                        );

                                                        // Add Empty Days before the 1st of the Month
                                                        ClearCollect(
                                                            CalendarWithBlanks,
                                                            ForAll(
                                                                Sequence(Weekday(Date(Year(Today()), SelectedMonth, 1), StartOfWeek.Sunday) - 1),
                                                                {
                                                                    DayNumber: Blank(),
                                                                    DayDate: Blank(),
                                                                    DayName: Blank(),
                                                                    IsToday: false,
                                                                    IsDisabled: true
                                                                }
                                                            )
                                                        );

                                                        // Merge Empty Days with the Actual Calendar Days
                                                        Collect(CalendarWithBlanks, CalendarDays);

                                                        // Reset SelectedDate to today if we're in the current month
                                                        If(
                                                            Month(Today()) = SelectedMonth && Year(Today()) = Year(Today()),
                                                            Set(SelectedDate, Today())
                                                        );
                                                        Reset(CalenderGallery);
                                                      Width: =If(IsMobileLayout,120, 380)
                                                    Children:
                                                      - MonthName2:
                                                          Control: DropDownDataField@1.5.0
                                                          Variant: textualColumn
                                                          IsLocked: true
                                                          Properties:
                                                            FieldDisplayName: ="MonthName"
                                                            FieldName: ="MonthName"
                                                            FieldType: ="s"
                                                            Order: =1
                                                      - MonthNumber2:
                                                          Control: DropDownDataField@1.5.0
                                                          Variant: textualColumn
                                                          IsLocked: true
                                                          Properties:
                                                            FieldDisplayName: ="MonthNumber"
                                                            FieldName: ="MonthNumber"
                                                            FieldType: ="n"
                                                            Order: =2
