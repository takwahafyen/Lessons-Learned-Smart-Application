    Properties:
      Fill: =RGBA(0, 0, 0, 0)
      OnVisible: |-
        =UpdateContext({CurrentView:"ViewCars"});
        UpdateContext({DateandTimeView:"Date Container"});

        Reset(CalenderGallery);
    Children:
      - Con_Main_CreateBooking:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
