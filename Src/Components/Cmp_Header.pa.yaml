ComponentDefinitions:
  Cmp_Header:
    DefinitionType: CanvasComponent
    CustomProperties:
      Color:
        PropertyKind: Input
        DisplayName: Color
        Description: Property to hold colors
        DataType: Color
        Default: =RGBA(255, 255, 255, 1)
      CurrentIndicatorColor:
        PropertyKind: Input
        DisplayName: CurrentIndicatorColor
        Description: A custom property
        DataType: Color
        Default: =RGBA(252, 194, 27, 1)
      Default:
        PropertyKind: Input
        DisplayName: Default
        Description: A custom property
        DataType: Text
        Default: ="Book a Bus"
      DisabledColor:
        PropertyKind: Input
        DisplayName: DisabledColor
        Description: A custom property
        DataType: Color
        Default: =RGBA(89, 89, 89, 1)
      HoverFill:
        PropertyKind: Input
        DisplayName: HoverFill
        Description: A custom property
        DataType: Color
        Default: =RGBA(0, 0, 0, 1)
      SelectedFill:
        PropertyKind: Input
        DisplayName: SelectedFill
        Description: Property to hold menu selected colours
        DataType: Color
        Default: =RGBA(44,44, 44, 1)
      SidebarItems:
        PropertyKind: Input
        DisplayName: SidebarItems
        Description: Table to help menu items
        DataType: Table
        Default: "=Table(\r\n    {Value: \"Book a Bus\", Icon:ImgCreateDisabled , IconSelected:ImgCreateSelected, Screen: App.ActiveScreen},\r\n    {Value: \"Bookings\", Icon:ImgBookingDisabled, IconSelected:ImgBookingSelected, Screen: App.ActiveScreen},\r\n    {Value: \"Buses\", Icon: ImgCarDisabled, IconSelected:ImgCarSelected,Screen: App.ActiveScreen},\r\n    {Value: \"My Bookings\", Icon: ImgHistoryDisabled, IconSelected:ImgHistorySelected,Screen: App.ActiveScreen}\r\n   \r\n )"
    Properties:
      Fill: =RGBA(32, 32, 32, 1)
      Height: =77
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - Cmp_Header_Image:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =If(App.ActiveScreen.Size = ScreenSize.Small ,30,40)+100
            Image: ='Design_sans_titre__8_-removebg-preview'
            RadiusBottomLeft: =50
            RadiusBottomRight: =50
            RadiusTopLeft: =50
            RadiusTopRight: =50
            Width: =If(App.ActiveScreen.Size = ScreenSize.Small ,30,40)+80
            X: =Parent.Width - Self.Width - 2
            Y: =(Parent.Height-Self.Height)/2.1
      - Image10:
          Control: Image@2.2.3
          Properties:
            Height: =68
            Image: ='ChatGPT Image 9 avr. 2025, 11_33_05-Photoroom'
            Visible: =false
            Width: =87
            Y: =(Parent.Height-Self.Height)/2.5
      - ButtonCanvas1_5:
          Control: Button@0.0.45
          Properties:
            OnSelect: |
              =Set(CurrentUser, Blank());
              Set(IsAdminUser, false);
              Navigate(HomeScreen, ScreenTransition.Fade);
            Text: ="Logout"
            Visible: |+
              =IsAdminUser = true
            X: =25
            Y: =22
      - Image18:
          Control: Image@2.2.3
          Properties:
            Height: =Parent.Height
            Image: =Capturef
            Width: =206
            X: =80
            Y: =(Parent.Height-Self.Height)/2.5
