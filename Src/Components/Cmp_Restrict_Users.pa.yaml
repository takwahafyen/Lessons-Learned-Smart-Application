ComponentDefinitions:
  Cmp_Restrict_Users:
    DefinitionType: CanvasComponent
    Properties:
      Fill: =RGBA(44, 44, 44, 1)
      Height: =Max(App.Height, App.MinScreenHeight)
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - ImgRestricted:
          Control: Image@2.2.3
          Properties:
            Height: =150
            Image: =ImgAdmin
            Width: =150
            X: =(Parent.Width - Self.Width)/2
            Y: =(Parent.Height - Self.Height)/3
      - LblRestricted:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: ="You dont have the permission to view this Page. Request Access from Admin."
            Width: =Parent.Width
            Y: =ImgRestricted.Y + ImgRestricted.Height + 10
