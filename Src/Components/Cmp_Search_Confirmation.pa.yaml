ComponentDefinitions:
  Cmp_Search_Confirmation:
    DefinitionType: CanvasComponent
    Properties:
      Fill: =RGBA(0, 0, 0, 0.22)
      Height: =Max(App.Height, App.MinScreenHeight)
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - Cmp_Search_Confirmation_Body:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.ExtraBold
            Fill: =RGBA(44, 44, 44, 1)
            Height: =Parent.Height/3
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width/3
            X: =(Parent.Width - Self.Width)/2
            Y: =(Parent.Height - Self.Height)/2
          Children:
            - Cmp_Search_Confirmation_Text:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                  FontWeight: =FontWeight.Bold
                  Size: =12
                  Text: ="Are you Sure you want to Proceed with this Action?"
                  Width: =Parent.Width
                  Y: =80
            - Btn_Search_Confirmation_Cancel:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(252, 73, 73, 1)
                  Fill: =RGBA(112, 64, 64, 1)
                  HoverFill: =Parent.Fill
                  PressedFill: =Parent.Fill
                  Text: ="Yes"
                  Width: =97
                  X: =130
                  Y: =135
            - Btn_Search_Confirmation_Confirm:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(27, 252, 50, 1)
                  Fill: =RGBA(6, 88, 14, 1)
                  HoverFill: =Parent.Fill
                  PressedFill: =Parent.Fill
                  Text: ="Cancel"
                  Width: =97
                  X: =241
                  Y: =135
