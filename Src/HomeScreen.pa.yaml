                        - btnConfirmLogin:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =Self.Fill
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =ColorFade(Self.Fill, -10%)
                              DisabledColor: =RGBA(255, 255, 255, 1)
                              DisabledFill: =ColorFade(Self.Fill, 20%)
                              DisplayMode: |-
                                =If(
                                    IsBlank(txtLoginPassword.Text) || IsBlank(txtLoginUsername.Text) || Len(txtLoginPassword.Text) < 14,
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Fill: =RGBA(15, 108, 189, 1)
                              Font: =Font.'Segoe UI'
                              Height: =55
                              HoverBorderColor: =ColorFade(Self.Fill, -10%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(Self.Fill, -10%)
                              OnSelect: |-
                                =Set(
                                    gblCheckPasswordInSharepoint,
                                    LookUp(
                                        LoginDemo,
                                        UserName = txtLoginUsername.Text
                                    ).Password
                                );
                                Set(
                                    gblCapsInSharepointPasswords,
                                    ClearCollect(
                                        colCaps,
                                        ForAll(
                                            Split(
                                                gblCheckPasswordInSharepoint,
                                                ""
                                            ),
                                            If(
                                                IsMatch(
                                                    Value,
                                                    "[A-Z]"
                                                ),
                                                Value,
                                                ""
                                            )
                                        )
                                    );
                                    Concat(
                                        colCaps,
                                        Value,
                                        ""
                                    )
                                );
                                Set(
                                    gblCapsInUserPassword,
                                    ClearCollect(
                                        colCaps,
                                        ForAll(
                                            Split(
                                                txtLoginPassword.Text,
                                                ""
                                            ),
                                            If(
                                                IsMatch(
                                                    Value,
                                                    "[A-Z]"
                                                ),
                                                Value,
                                                ""
                                            )
                                        )
                                    );
                                    Concat(
                                        colCaps,
                                        Value,
                                        ""
                                    )
                                );
                                UpdateContext(
                                    {
                                        locUsernameError: IsBlank(
                                            LookUp(
                                                LoginDemo,
                                                UserName = txtLoginUsername.Text
                                            ).UserName
                                        )
                                    }
                                );
                                UpdateContext({locNumberofCaps: gblCapsInUserPassword <> gblCapsInSharepointPasswords}); 
                                UpdateContext({locPasswordCount: Len(txtLoginPassword.Text) <> Len(gblCheckPasswordInSharepoint)});
                                UpdateContext({locBlankPassword: IsBlank(gblCheckPasswordInSharepoint)});
                                UpdateContext({locPasswordError: locBlankPassword || (locPasswordCount And locNumberofCaps)});

                                If(
                                    locUsernameError,
                                    Notify(
                                        "Wrong username. Please try again",
                                        NotificationType.Error,
                                        3000
                                    );
                                    Set(
                                        gblShowLoginErrorIcon,
                                        true
                                    ),
                                    If(
                                        locPasswordError || locNumberofCaps || locPasswordCount,
                                        Notify(
                                            "Wrong password. Please try again",
                                            NotificationType.Error,
                                            3000
                                        );
                                        Set(
                                            gblShowLoginErrorIcon,
                                            true
                                        )
                                    )
                                );
                                If(
                                    locPasswordError || locUsernameError || locNumberofCaps || locPasswordCount,
                                    false,
                                    If(
                                        locPasswordError = false And locUsernameError = false And locNumberofCaps = false And locPasswordCount = false,
                                        Navigate(
                                            Booking,
                                            ScreenTransition.Fade
                                        );
                                        Notify(
                                            "Login Successful",
                                            NotificationType.Success,
                                            2000
                                        );
                                        Set(
                                            CurrentUser,
                                            LookUp(
                                                LoginDemo,
                                                UserName = txtLoginUsername.Text
                                            )
                                        );
                                        Set(
                                    IsAdminUser,
                                    CurrentUser.IsAdmin
                                );
                                        Set(
                                            ThisSession,
                                            Patch(
                                                LoginRecords,
                                                Defaults(LoginRecords),
                                                {
                                                    User: CurrentUser.UserName,
                                                    LoginTime: Now()
                                                }
                                            )
                                        );
                                        Reset(txtLoginPassword);
                                        Reset(txtLoginUsername);
                                    )
                                );
                              PressedBorderColor: =ColorFade(Self.Fill, -10%)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =ColorFade(Self.Fill, -20%)
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Size: =16
                              Text: ="Login"
                              Tooltip: =If(IsBlank(txtLoginPassword.Text) || IsBlank(txtLoginUsername.Text), "All fields are required")
                              Width: =550
