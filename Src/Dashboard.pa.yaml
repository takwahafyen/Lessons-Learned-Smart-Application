                  - Btn_Search_Confirmation_Cancel_MyBooking:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(252, 73, 73, 1)
                        Fill: =RGBA(112, 64, 64, 1)
                        Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                        FontWeight: =FontWeight.Normal
                        HoverFill: =Parent.Fill
                        OnSelect: "=UpdateContext({ShowLoader:true});\r\nIf(\r\n    Not(IsBlank(VarRecord)),  // Ensure VarRecord has a value\r\n    // First, patch the BookingStatus to \"Cancelled\"\r\n    Patch(\r\n        'Booking List',  \r\n        LookUp('Booking List', ID = VarRecord.ID),  // Find the matching item by ID in SharePoint list\r\n        {\r\n            BookingStatus: { Value: \"Cancelled\" }\r\n        }\r\n    );\r\n    \r\n    // Send email notification to the Requestor and BookingOccupants\r\n    Office365Outlook.SendEmailV2(\r\n        VarRecord.Requestor.Email,  // Email address of the Requestor (assuming it's a Person field)\r\n        \"Booking Cancellation Notification\",  // Subject of the email\r\n        \"Dear \" & VarRecord.Requestor.DisplayName & \",\" & \r\n        \"<br><br>Your booking for the car with ID \" & VarRecord.BookedCarID & \" has been cancelled.\" & \r\n        \"<br>Details:\" &\r\n        \"<br>Booking Purpose: \" & VarRecord.BookingPurpose.Value & \r\n        \"<br>Booking Date: \" & Text(VarRecord.BookingDate, \"[$-en-US]dd/mm/yyyy\") & \r\n        \"<br><br>Thank you.\",  // Body of the email (HTML formatted),\r\n        {\r\n            To: Concat(VarRecord.BookingOccupants, Email & \";\")  // Send to multiple occupants, assuming BookingOccupants is a Person/Group column\r\n        }\r\n    );\r\n    \r\n    Notify(\"Booking has been cancelled, and an email notification has been sent.\", NotificationType.Success),\r\n    \r\n    Notify(\"No record selected to cancel.\", NotificationType.Error)  // Handle the case where VarRecord is blank\r\n);\r\n\r\nClearCollect(BookingListCollection,'Booking List');\r\nUpdateContext({AllBookingPopup:false});\r\nUpdateContext({ShowLoader:false});\r\nUpdateContext({ConfirmationPopup:true})\r\n"
                        PressedFill: =Parent.Fill
                        Size: =UX.Font.Normal
                        Text: ="Cancel Booking"
                        Width: =140
                        X: =Btn_Search_Confirmation_Confirm_MyBooking.X + Btn_Search_Confirmation_Confirm_MyBooking.Width + 10
                        Y: =140
