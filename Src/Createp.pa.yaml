                                    - SummaryCreateBookingNxtBtn_1:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Color: =RGBA(255, 255, 255, 1)
                                          Fill: =RGBA(252, 194, 27, 1)
                                          Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                          Height: =If( IsMobileLayout,40,60)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =ColorFade(Self.Fill, -20%)
                                          OnSelect: "=// ✅ Afficher le loader\r\nUpdateContext({ShowLoader: true});\r\n\r\n// ✅ Patch : ajout ou modification\r\nSet(\r\n    PatchedItem5,\r\n    Patch(\r\n        'Booking pList',\r\n        If(IsBlank(varItemToEdit), Defaults('Booking pList'), varItemToEdit),\r\n        {\r\n            BookingPurpose: {\r\n                '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\r\n                Value: GalleryPurposeofBooking_1.Selected.Value\r\n            },\r\n            BookedCarID: GalleryAvaliableCars_1.Selected.CarID,\r\n            BookedCarName: GalleryAvaliableCars_1.Selected.Title,\r\n            BookingPickupLocation: TxtPickUpLocation_1.Text,\r\n            BookingDropoffLocation: TxtDropoffLocation_1.Text,\r\n            BookingDropoffLocation2: TxtDropoffLocation_2.Text,\r\n            Requestor: {\r\n                '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\",\r\n                Claims: \"i:0#.f|membership|\" & Lower(Office365Users.MyProfile().Mail),\r\n                DisplayName: Office365Users.MyProfile().DisplayName,\r\n                Email: Office365Users.MyProfile().Mail,\r\n                Department: Office365Users.MyProfile().Department,\r\n                JobTitle: Office365Users.MyProfile().JobTitle,\r\n                Picture: Office365Users.UserPhotoV2(Office365Users.MyProfile().Mail)\r\n            },\r\n            BookingDate: CalenderGallery.Selected.DayDate,\r\n           \r\n            BookingOccupants: If(\r\n                IsEmpty(SelectedUsers),\r\n                Blank(),\r\n                ForAll(\r\n                    SelectedUsers,\r\n                    {\r\n                        '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\",\r\n                        Claims: \"i:0#.f|membership|\" & Lower(ThisRecord.Mail),\r\n                        DisplayName: ThisRecord.DisplayName,\r\n                        Email: ThisRecord.Mail,\r\n                        Department: Office365Users.UserProfile(ThisRecord.Mail).Department,\r\n                        Picture: Office365Users.UserPhotoV2(ThisRecord.Mail),\r\n                        JobTitle: Office365Users.UserProfile(ThisRecord.Mail).JobTitle\r\n                    }\r\n                )\r\n            ),\r\n            BookingStatus: {\r\n                '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\r\n                Value: \"Positive Lesson\"\r\n            }\r\n        }\r\n    )\r\n);\r\n\r\n// ✅ Vérifier le succès\r\nIf(\r\n    !IsBlank(PatchedItem5) && !IsError(PatchedItem5),\r\n    \r\n    Notify(\"Lesson saved with Success !\", NotificationType.Success);\r\n\r\n    // ✅ Nettoyer les champs\r\n    Clear(SelectedUsers);\r\n    Reset(TxtPickUpLocation_1);\r\n    Reset(TxtDropoffLocation_1);\r\n    Reset(TxtDropoffLocation_2);\r\n    Reset(AddAttachment_6);\r\n    Reset(GalleryPurposeofBooking_1);\r\n    Reset(GalleryAvaliableCars_1);\r\n    Reset(CalenderGallery);\r\n    Reset(TimeGallery_starttime);\r\n    Reset(TimeGallery_EndTime_);\r\n\r\n    // ✅ Réinitialiser le contexte\r\n    UpdateContext({\r\n        ShowLoader: false,\r\n        EmptyFields: false,\r\n        CurrentView: \"ViewSuccess\"\r\n    });\r\n\r\n    // ✅ Réinitialiser varItemToEdit pour pouvoir refaire un ajout\r\n    Set(varItemToEdit, Blank());\r\n\r\n    // ✅ Recharger les données\r\n    ClearCollect(BookingpListCollection, 'Booking pList')\r\n    \r\n;);\r\n"
                                          PressedFill: =ColorFade(Self.Fill, -20%)
