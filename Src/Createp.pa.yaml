                                          OnSelect: "=// Check if a pick-up time is selected\r\nIf(\r\n    IsBlank(TimeGallery_starttime_1.Selected.Time), \r\n    // Show notification if no pick-up time is selected\r\n    Notify(\"No pick-up time has been selected. Please select another date\", NotificationType.Error),\r\n\r\n    // Otherwise, proceed with the logic\r\n    UpdateContext({ShowSearch:true}); // Proceed to search\r\n\r\n    // Load the cars into a collection\r\n    ClearCollect(BookingpCarCollection, 'Booking pCars List');\r\n\r\n    // Load Booking List as well as into a collection first\r\n    ClearCollect(\r\n        BookingpListCollection,\r\n        'Booking pList'\r\n    );\r\n\r\n    // Collect conflicting bookings using the local collection\r\n    ClearCollect(\r\n        ConflictingBookings,\r\n        Filter(\r\n            BookingpListCollection, BookingStatus.Value <> \"Cancelled\" &&\r\n            BookingDate = CalenderGallery_1.Selected.DayDate && \r\n            \r\n            (\r\n                (\r\n                    TimeValue(Text(TimeGallery_starttime_1.Selected.Time, \"[$-en-US]hh:mm:ss AM/PM\")) >= TimeValue(BookingPickUpTime) &&\r\n                    TimeValue(Text(TimeGallery_starttime_1.Selected.Time, \"[$-en-US]hh:mm:ss AM/PM\")) < TimeValue(BookingDropOffTime)\r\n                ) ||\r\n                (\r\n                    TimeValue(Text(TimeGallery_EndTime__1.Selected.Time, \"[$-en-US]hh:mm:ss AM/PM\")) > TimeValue(BookingPickUpTime) &&\r\n                    TimeValue(Text(TimeGallery_EndTime__1.Selected.Time, \"[$-en-US]hh:mm:ss AM/PM\")) <= TimeValue(BookingDropOffTime)\r\n                ) ||\r\n                (\r\n                    TimeValue(Text(TimeGallery_starttime_1.Selected.Time, \"[$-en-US]hh:mm:ss AM/PM\")) <= TimeValue(BookingPickUpTime) &&\r\n                    TimeValue(Text(TimeGallery_EndTime__1.Selected.Time, \"[$-en-US]hh:mm:ss AM/PM\")) >= TimeValue(BookingDropOffTime)\r\n                )\r\n            )\r\n        )\r\n    );\r\n\r\n    // Update context variables\r\n    UpdateContext({ShowSearch: false});\r\n    UpdateContext({CurrentView: \"ViewCars\"});\r\n    UpdateContext({CarLoader: true})\r\n)\r\n"
