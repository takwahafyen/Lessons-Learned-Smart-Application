\"Booking information successfully updated.\", // Show success message\r\n        ShowLoader: false, // Hide loader\r\n        AddCarPopup: false // Close the popup after submission\r\n    })\r\n);\r\nClearCollect(BookingpCarCollection,'Booking pCars List')\r\n"
