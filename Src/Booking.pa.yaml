Screens:
  Booking:
    Properties:
      Fill: =RGBA(44, 44, 44, 1)
      OnVisible: "=If(\r\n   IsEmpty(BookingListCollection),\r\n   \r\n//Reset(TextInput2_2);\r\nReset(Txt_Filter_Dashboard_Search);\r\n\r\n\r\n// Populate SelectedBookingStatus with default options from the BookingStatus choice column\r\nClearCollect(\r\n    SelectedBookingStatus,\r\n    Choices('Booking List'.BookingStatus)\r\n);\r\n\r\n);\r\n\r\n"
    Children:
      - CanvasScrollScreenDashboard:
          Control: FluidGrid@2.3.1
          Properties:
            BorderThickness: =0
            Fill: =RGBA(44, 44, 44, 1)
            Height: =Parent.Height - Self.Y
            Width: =If(IsMobileLayout,Parent.Width, Parent.Width - Cmp_SideNav_Dashboard.Width)
            X: =100
            Y: =62
          Children:
            - ScrollScreenDashboard:
                Control: DataCard@1.0.2
                Properties:
                  Height: =If(CountRows(BookingListGallery.AllItems)<500,Parent.Height, CountRows(BookingListGallery.AllItems)*100)
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - Con_DashboardMain:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: |-
                          =If(
                              IsMobileLayout,
                              Parent.Height - Con_DashboardCounter.Height - Con_DashboardHeader.Height,
                              Parent.Height 
                          )
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(IsMobileLayout,Parent.Width,Parent.Width)
                        X: |-
                          =//If(IsMobileLayout,0,100)
                          0
                        Y: "=\r\n   Con_DashboardCounter.Y + Con_DashboardCounter.Height\r\n    \r\n   \r\n"
                      Children:
                        - Con_DashboardBody:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(44, 44, 44, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Con_GalleryPanel:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(44, 44, 44, 1)
                                    Height: =Parent.Height- Con_DashboardHeader.Height
                                    LayoutDirection: =If(IsMobileLayout || IsTabletLayout,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                                    PaddingLeft: =20
                                    PaddingRight: =20
                                    PaddingTop: =5
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =If(IsMobileLayout || IsTabletLayout ,Parent.Width,Parent.Width- Cmp_SideNav_Dashboard.Width)
                                  Children:
                                    - Con_Gallery:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(32, 32, 32, 1)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =5
                                          PaddingLeft: =20
                                          PaddingRight: =20
                                          PaddingTop: =5
                                        Children:
                                          - con_FilterDashboard:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.SetByContainer
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =50
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - Con_TxtAll Booking:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.SetByContainer
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =Parent.Height
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      PaddingLeft: =10
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Width: =If(IsMobileLayout || IsTabletLayout ,100,200)
                                                    Children:
                                                      - Lbl_All Bookings:
                                                          Control: Text@0.0.51
                                                          Properties:
                                                            Align: ='TextCanvas.Align'.Start
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                            FontColor: =RGBA(252, 194, 27, 1)
                                                            Size: =If(IsMobileLayout || IsTabletLayout ,12,18)
                                                            Text: ="All Lessons"
                                                            Weight: ='TextCanvas.Weight'.Bold
                                                            Width: =Parent.Width
                                                - Con_FilterButtonouterContainer:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      Height: =Parent.Height
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutJustifyContent: =LayoutJustifyContent.End
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                    Children:
                                                      - Con_FilterButton:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.End
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =Parent.Height
                                                            LayoutAlignItems: =LayoutAlignItems.Center
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            PaddingRight: =5
                                                            PaddingTop: =5
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =Parent.Width
                                                          Children:
                                                            - FilterButton:
                                                                Control: Button@0.0.45
                                                                Properties:
                                                                  Align: =Align.Justify
                                                                  AlignInContainer: =AlignInContainer.End
                                                                  Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                                  BasePaletteColor: =RGBA(32, 32, 32, 1)
                                                                  BorderColor: =RGBA(252, 194, 27, 1)
                                                                  BorderRadiusBottomLeft: =10
                                                                  BorderRadiusBottomRight: =10
                                                                  BorderRadiusTopLeft: =10
                                                                  BorderRadiusTopRight: =10
                                                                  BorderThickness: =2
                                                                  Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                                  FontColor: =RGBA(255, 255, 255, 1)
                                                                  FontSize: '=                       '
                                                                  Height: =If(IsMobileLayout,35, 40)
                                                                  Icon: ="ArrowClockwise"
                                                                  Layout: =If(IsMobileLayout,"Icon only" ,"Icon before")
                                                                  OnSelect: |-
                                                                    =UpdateContext({ShowLoader:false});
                                                                    ClearCollect(BookingListCollection,'Booking List');
                                                                    UpdateContext({ShowLoader:false});
                                                                  PaddingLeft: =10
                                                                  Text: ="Refresh"
                                                                  Width: |+
                                                                    =If(IsMobileLayout,40, 100)
                                                                  Y: =(Parent.Height-Self.Height)/2
                                                      - Con_FilterButton_2:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.End
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =Parent.Height
                                                            LayoutAlignItems: =LayoutAlignItems.Center
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            PaddingRight: =5
                                                            PaddingTop: =5
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =120
                                                          Children:
                                                            - FilterButton_9:
                                                                Control: Button@0.0.45
                                                                Properties:
                                                                  Align: =Align.Justify
                                                                  AlignInContainer: =AlignInContainer.End
                                                                  Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                                  BasePaletteColor: =RGBA(32, 32, 32, 1)
                                                                  BorderColor: =RGBA(252, 194, 27, 1)
                                                                  BorderRadiusBottomLeft: =10
                                                                  BorderRadiusBottomRight: =10
                                                                  BorderRadiusTopLeft: =10
                                                                  BorderRadiusTopRight: =10
                                                                  BorderThickness: =2
                                                                  Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                                  FontColor: =RGBA(255, 255, 255, 1)
                                                                  FontSize: '=                       '
                                                                  Height: =If(IsMobileLayout,35, 40)
                                                                  Icon: ="Filter"
                                                                  Layout: =If(IsMobileLayout,"Icon only" ,"Icon before")
                                                                  OnSelect: =UpdateContext({FilterPopup2:true})
                                                                  PaddingLeft: =10
                                                                  Text: ="Filter"
                                                                  Width: |
                                                                    =If(IsMobileLayout,40, 100)
                                                                  Y: =(Parent.Height-Self.Height)/2
                                          - Con_HeaderTxt:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.Regular
                                                Fill: =RGBA(44, 44, 44, 1)
                                                FillPortions: =0
                                                Height: =50
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinWidth: =320
                                              Children:
                                                - lbl_Requestor:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      Align: ='TextCanvas.Align'.Center
                                                      BorderStyle: =BorderStyle.Solid
                                                      FillPortions: =1
                                                      Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                      FontColor: =RGBA(255, 255, 255, 1)
                                                      Height: =Parent.Height
                                                      LayoutMinWidth: =60
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,12,16)
                                                      Text: |-
                                                        ="🚚 Project"
                                                      Visible: |+
                                                        =true
                                                      Weight: ='TextCanvas.Weight'.Bold
                                                - lbl_Bus:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      Align: ='TextCanvas.Align'.Center
                                                      BorderStyle: =BorderStyle.Solid
                                                      FillPortions: =1
                                                      Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                      FontColor: =RGBA(255, 255, 255, 1)
                                                      Height: =Parent.Height
                                                      LayoutMinWidth: =60
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,12,16)
                                                      Text: |-
                                                        ="🔍  Problem"
                                                      Weight: ='TextCanvas.Weight'.Bold
                                                - lbl_BusID:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      Align: ='TextCanvas.Align'.Center
                                                      BorderStyle: =BorderStyle.Solid
                                                      FillPortions: =1
                                                      Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                      FontColor: =RGBA(255, 255, 255, 1)
                                                      Height: =Parent.Height
                                                      LayoutMinWidth: =60
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,12,16)
                                                      Text: |-
                                                        ="🚚 Solution"
                                                      Weight: ='TextCanvas.Weight'.Bold
                                                - lbl_DateofRequest:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      Align: ='TextCanvas.Align'.Center
                                                      BorderStyle: =BorderStyle.Solid
                                                      FillPortions: =1
                                                      Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                      FontColor: =RGBA(255, 255, 255, 1)
                                                      Height: =Parent.Height
                                                      LayoutMinWidth: =60
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,11,16)
                                                      Text: ="❌ IMG NIO"
                                                      VerticalAlign: =VerticalAlign.Top
                                                      Weight: ='TextCanvas.Weight'.Bold
                                                - Lbl_SeatNo:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      Align: ='TextCanvas.Align'.Center
                                                      BorderStyle: =BorderStyle.Solid
                                                      FillPortions: =1
                                                      Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                      FontColor: =RGBA(255, 255, 255, 1)
                                                      Height: =Parent.Height
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,12,16)
                                                      Text: ="✔️ IMG IO"
                                                      Visible: =If(IsMobileLayout || IsTabletLayout ,false,true)
                                                      Weight: ='TextCanvas.Weight'.Bold
                                                - txtstatus:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      Align: ='TextCanvas.Align'.Center
                                                      BorderStyle: =BorderStyle.Solid
                                                      FillPortions: =1
                                                      Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                      FontColor: =RGBA(255, 255, 255, 1)
                                                      Height: =Parent.Height
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,12,16)
                                                      Text: |-
                                                        ="🔑 Category"
                                                      Visible: =If(IsMobileLayout || IsTabletLayout ,false,true)
                                                      Weight: ='TextCanvas.Weight'.Bold
                                                - lbl_Action:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      Align: ='TextCanvas.Align'.Start
                                                      BorderStyle: =BorderStyle.Solid
                                                      FillPortions: =1
                                                      Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                      FontColor: =RGBA(255, 255, 255, 1)
                                                      Height: =Parent.Height
                                                      PaddingLeft: =20
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,12,16)
                                                      Text: |-
                                                        ="🔨 Actions"
                                                      Visible: =If(IsMobileLayout || IsTabletLayout ,false,true)
                                                      Weight: ='TextCanvas.Weight'.Bold
                                          - BookingListGallery:
                                              Control: Gallery@2.15.0
                                              Variant: Vertical
                                              Properties:
                                                AlignInContainer: =AlignInContainer.SetByContainer
                                                Height: =CountRows(BookingListGallery.AllItems)*100
                                                Items: "=// Filter the BookingListCollection based in the logged in USer and various criteria and sort the results\r\nSortByColumns(\r\n    Filter(\r\n        BookingListCollection,\r\n        Requestor.Email = User().Email && \r\n        // Partial match for BookedCarID and BookedCarName using Txt_Filter_Dashboard_Search\r\n        (IsBlank(Txt_Filter_Dashboard_Search.Text) ||\r\n         // Check if BookedCarID starts with the search text\r\n StartsWith(\r\n            Text(BookingPurpose),\r\n            Txt_Filter_Dashboard_Search.Text\r\n        ) ||\r\n         // Check if BookingPickupLocation starts with the search text\r\n StartsWith(\r\n            Text(BookingPickupLocation),\r\n            Txt_Filter_Dashboard_Search.Text\r\n        ) ||\r\n         // Check if BookingDropoffLocation starts with the search text\r\n StartsWith(\r\n            Text(BookingDropoffLocation),\r\n            Txt_Filter_Dashboard_Search.Text\r\n        ) ||\r\n         // Check if BookedCarName starts with the search text\r\n StartsWith(\r\n            BookedCarName,\r\n            Txt_Filter_Dashboard_Search.Text\r\n        )),\r\n        // Filter by BookingStatus (Choice column) using the collection\r\n        (IsBlank(SelectedBookingStatus) ||\r\n         // Check if the BookingStatus exists in the selected statuses\r\n CountRows(\r\n            Filter(\r\n                SelectedBookingStatus,\r\n                Value = BookingStatus.Value\r\n            )\r\n        ) > 0),\r\n        // Filter by BookingPurpose (Choice column) using the collection\r\n       \r\n    \r\n        // Filter by date range\r\n        (IsBlank(DatePickerFrom_Filter_MyBooking_DateRange.SelectedDate) || IsBlank(DatePickerTo_Filter_MyBooking_DateRange.SelectedDate) ||\r\n         // Check if BookingDate is within the selected date range\r\n (BookingDate >= DatePickerFrom_Filter_MyBooking_DateRange.SelectedDate && BookingDate <= DatePickerTo_Filter_MyBooking_DateRange.SelectedDate))\r\n    ),\r\n    // Sort by the Created date in descending order to show the latest entries first\r\n    \"Created\",\r\n    SortOrder.Descending\r\n)"
                                                OnSelect: =UpdateContext({AllBookingPopup:false});
                                                TemplatePadding: =2
                                                TemplateSize: =If(IsMobileLayout || IsTabletLayout ,60,60)
                                              Children:
                                                - '!IsBlank(CurrentUser) &&':
                                                    Control: GroupContainer@1.5.0
                                                    Variant: ManualLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(44, 44, 44, 1)
                                                      Height: =Parent.TemplateHeight
                                                      PaddingRight: =1
                                                      RadiusBottomLeft: =10
                                                      RadiusBottomRight: =10
                                                      RadiusTopLeft: =10
                                                      RadiusTopRight: =10
                                                      Width: =Parent.TemplateWidth
                                                    Children:
                                                      - lbl_RequestorName:
                                                          Control: Text@0.0.51
                                                          Properties:
                                                            Align: ='TextCanvas.Align'.Center
                                                            Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                            FontColor: =RGBA(255, 255, 255, 1)
                                                            Height: =40
                                                            Size: =If(IsMobileLayout || IsTabletLayout ,10,14)
                                                            Text: =ThisItem.BookedCarName
                                                            Weight: ='TextCanvas.Weight'.Medium
                                                            Width: =If(IsMobileLayout || IsTabletLayout,Parent.Width/4, Parent.Width/7-'!IsBlank(CurrentUser) &&'.PaddingRight-'!IsBlank(CurrentUser) &&'.PaddingLeft)
                                                            Y: =(Parent.Height-Self.Height)/2
                                                      - lbl_buses:
                                                          Control: Text@0.0.51
                                                          Properties:
                                                            Align: ='TextCanvas.Align'.Center
                                                            Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                            FontColor: =RGBA(255, 255, 255, 1)
                                                            Height: =40
                                                            Size: =If(IsMobileLayout || IsTabletLayout ,10,14)
                                                            Text: =ThisItem.BookingPickupLocation
                                                            Weight: ='TextCanvas.Weight'.Medium
                                                            Width: =If(IsMobileLayout || IsTabletLayout,Parent.Width/4, Parent.Width/7-'!IsBlank(CurrentUser) &&'.PaddingRight-'!IsBlank(CurrentUser) &&'.PaddingLeft)
                                                            X: =lbl_RequestorName.X+lbl_RequestorName.Width
                                                            Y: =(Parent.Height-Self.Height)/2
                                                      - lbl_BusIDNo:
                                                          Control: Text@0.0.51
                                                          Properties:
                                                            Align: ='TextCanvas.Align'.Center
                                                            Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                            FontColor: =RGBA(255, 255, 255, 1)
                                                            Height: =40
                                                            Size: =If(IsMobileLayout || IsTabletLayout ,10,14)
                                                            Text: =ThisItem.BookingDropoffLocation
                                                            Weight: ='TextCanvas.Weight'.Medium
                                                            Width: =If(IsMobileLayout || IsTabletLayout,Parent.Width/4, Parent.Width/7-'!IsBlank(CurrentUser) &&'.PaddingRight-'!IsBlank(CurrentUser) &&'.PaddingLeft)
                                                            X: =lbl_buses.X+lbl_buses.Width
                                                            Y: =(Parent.Height-Self.Height)/2
                                                      - ConOccupantsDisplay:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            ContentLanguage: =ThisItem.BookingDate
                                                            DropShadow: =DropShadow.None
                                                            Height: =40
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Visible: =false
                                                            Width: =Parent.Width/7-'!IsBlank(CurrentUser) &&'.PaddingRight-'!IsBlank(CurrentUser) &&'.PaddingLeft
                                                            X: =lbl_DateofRequest.X+lbl_DateofRequest.Width
                                                            Y: =(Parent.Height-Self.Height)/2
                                                          Children:
                                                            - ConOccupantsCount:
                                                                Control: GroupContainer@1.5.0
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  Height: =40
                                                                  LayoutDirection: =LayoutDirection.Vertical
                                                                  PaddingTop: =5
                                                                  Visible: =false
                                                                  Width: =50
                                                                Children:
                                                                  - ConOccupantsCounts:
                                                                      Control: GroupContainer@1.5.0
                                                                      Variant: ManualLayout
                                                                      Properties:
                                                                        BorderColor: =RGBA(252, 194, 27, 1)
                                                                        BorderThickness: =1
                                                                        Height: =30
                                                                        RadiusBottomLeft: =360
                                                                        RadiusBottomRight: =360
                                                                        RadiusTopLeft: =360
                                                                        RadiusTopRight: =360
                                                                        Width: =30
                                                                        X: =(Parent.Width-Self.Width)/2
                                                                        Y: =(Parent.Height-Self.Height)/2
                                                                      Children:
                                                                        - OccupantsCount:
                                                                            Control: Text@0.0.51
                                                                            Properties:
                                                                              Align: ='TextCanvas.Align'.Center
                                                                              FontColor: =RGBA(255, 255, 255, 1)
                                                                              Height: =Parent.Height
                                                                              Size: =18
                                                                              Text: =CountRows(ThisItem.BookingOccupants)
                                                                              Weight: ='TextCanvas.Weight'.Bold
                                                                              Width: =Parent.Width
                                                                              X: =(Parent.Width-Self.Width)/2
                                                                              Y: =(Parent.Height-Self.Height)/2
                                                            - lbl_Date:
                                                                Control: Text@0.0.51
                                                                Properties:
                                                                  Align: ='TextCanvas.Align'.Center
                                                                  Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                                  FontColor: =RGBA(255, 255, 255, 1)
                                                                  Height: =40
                                                                  LayoutMinHeight: =
                                                                  LayoutMinWidth: =
                                                                  Size: =If(IsMobileLayout || IsTabletLayout ,10,14)
                                                                  Text: =ThisItem.BookingDate
                                                                  Weight: ='TextCanvas.Weight'.Medium
                                                                  Width: =If(IsMobileLayout || IsTabletLayout,Parent.Width/4, Parent.Width/7-BtnOverlayBookingListGallery_1.PaddingRight-BtnOverlayBookingListGallery_1.PaddingLeft)
                                                                  X: =lbl_BusIDNo_3.X+lbl_BusIDNo_3.Width
                                                                  Y: =(Parent.Height-Self.Height)/2
                                                      - lbl_Status:
                                                          Control: Text@0.0.51
                                                          Properties:
                                                            Align: ='TextCanvas.Align'.Center
                                                            FontColor: |+
                                                              =Switch(
                                                                 ThisItem.BookingPurpose,
                                                                 "Best Practice", RGBA(27, 252, 50, 1),
                                                                 "Reclamation", RGBA(252, 73, 73, 1),
                                                                 RGBA(0, 128, 128, 1) // valeur par défaut
                                                              )
                                                            Height: =40
                                                            Size: =If(IsMobileLayout || IsTabletLayout ,12,14)
                                                            Text: =ThisItem.BookingPurpose
                                                            Visible: =If(IsMobileLayout || IsTabletLayout ,false,true)
                                                            Weight: ='TextCanvas.Weight'.Bold
                                                            Width: =Parent.Width/7-'!IsBlank(CurrentUser) &&'.PaddingRight-'!IsBlank(CurrentUser) &&'.PaddingLeft
                                                            X: =ConOccupantsDisplay.X+ConOccupantsDisplay.Width
                                                            Y: =(Parent.Height-Self.Height)/2
                                                      - Button_Action:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            BorderColor: =Switch(Button_Action.Text,"Best Practice",ColorValue("#1BFC32"),"Reclamation",ColorValue("#FC4949"))
                                                            Color: =RGBA(100, 255, 255, 1)
                                                            DisabledBorderColor: =RGBA(100, 244, 244, 1)
                                                            DisabledColor: =RGBA(100, 166, 166, 1)
                                                            DisabledFill: =RGBA(100, 49, 51, 1)
                                                            Fill: =Switch(Button_Action.Text,"Best Practice",ColorValue("#06580E"),"Reclamation",ColorValue("#704040"))
                                                            Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                            FontWeight: =FontWeight.Bold
                                                            HoverBorderColor: =Switch(Button_Action.Text,"Best Practice",Color.LightGreen,"Reclamation",Color.Red)
                                                            HoverColor: =RGBA(255, 255, 255, 1)
                                                            HoverFill: =Switch(Button_Action.Text,"Best Practice",Color.LightGreen,"Reclamation",Color.Red)
                                                            OnSelect: |+
                                                              =UpdateContext({ ShowLoader: true });
                                                              Remove('Booking List', ThisItem);
                                                              Refresh('Booking List');
                                                              UpdateContext({ ShowLoader: false });
