Screens:
  Bookingp:
    Properties:
      Fill: =RGBA(0, 0, 0, 0)
      OnVisible: "=If(\r\n   IsEmpty(BookingpListCollection),\r\n   \r\n//Reset(TextInput2_2);\r\nReset(Txt_Filter_Dashboard_Search_1);\r\nReset(DatePickerFrom_Filter_Dashboard_DateRange_1);\r\nReset(DatePickerTo_Filter_Dashboard_DateRange_1);\r\n// Populate SelectedBookingPurpose with default options from the BookingPurpose choice column\r\nClearCollect(\r\n    SelectedBookingPurpose,\r\n    Choices('Booking pList'.BookingPurpose)\r\n);\r\n\r\n// Populate SelectedBookingStatus with default options from the BookingStatus choice column\r\nClearCollect(\r\n    SelectedBookingStatus,\r\n    Choices('Booking pList'.BookingStatus)\r\n);\r\n\r\n);\r\nClearCollect(\r\n    SelectedBookingPurpose,\r\n    Choices('Booking pList'.BookingPurpose)\r\n);\r\n\r\nClearCollect(\r\n    SelectedBookingStatus,\r\n    Choices('Booking pList'.BookingStatus)\r\n);\r\n"
    Children:
      - Con_DashboardHeader_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(32, 32, 32, 1)
            Height: '= If(IsMobileLayout,60,80) '
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: |-
              =If(
                  IsMobileLayout,
                  0,
                  0
              )
          Children:
            - Cmp_Header_2:
                Control: CanvasComponent
                ComponentName: Cmp_Header
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  CurrentIndicatorColor: =RGBA(252, 194, 27, 1)
                  Default: ="Book a Bus"
                  DisabledColor: =RGBA(89, 89, 89, 1)
                  Fill: =RGBA(32, 32, 32, 1)
                  Height: =Parent.Height
                  HoverFill: =RGBA(0, 0, 0, 1)
                  SelectedFill: =RGBA(44,44, 44, 1)
                  SidebarItems: "=Table(\r\n    {Value: \"Book a Bus\", Icon:ImgCreateDisabled , IconSelected:ImgCreateSelected, Screen: App.ActiveScreen},\r\n    {Value: \"Bookings\", Icon:ImgBookingDisabled, IconSelected:ImgBookingSelected, Screen: App.ActiveScreen},\r\n    {Value: \"Buses\", Icon: ImgCarDisabled, IconSelected:ImgCarSelected,Screen: App.ActiveScreen},\r\n    {Value: \"My Bookings\", Icon: ImgHistoryDisabled, IconSelected:ImgHistorySelected,Screen: App.ActiveScreen}\r\n   \r\n )"
                  Width: =Max(App.Width, App.MinScreenWidth)
            - Con_AllBookingPopupCloseBody_4:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.End
                  Fill: =RGBA(252, 194, 27, 1)
                  FillPortions: =0
                  Height: =30
                  RadiusBottomLeft: =360
                  RadiusBottomRight: =360
                  RadiusTopLeft: =360
                  RadiusTopRight: =360
                  Width: =30
                  X: =(Parent.Width-Self.Width)/2
                  Y: =(Parent.Width-Self.Width)/2
                Children:
                  - BtnAllBookingPopupClose_4:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =RGBA(32, 32, 32, 1)
                        Height: =20
                        Icon: =Icon.Cancel
                        OnSelect: =UpdateContext({AllBookingPopup:false})
                        Width: =20
                        X: =(Parent.Width-Self.Width)/2
                        Y: =(Parent.Height-Self.Height)/2
            - Con_AllBookingPopupCloseBody_5:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.End
                  Fill: =RGBA(252, 194, 27, 1)
                  FillPortions: =0
                  Height: =30
                  RadiusBottomLeft: =360
                  RadiusBottomRight: =360
                  RadiusTopLeft: =360
                  RadiusTopRight: =360
                  Width: =30
