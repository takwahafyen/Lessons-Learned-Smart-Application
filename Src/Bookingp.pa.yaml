                                                            Width: =If(IsMobileLayout || IsTabletLayout,Parent.Width/4, Parent.Width/7-BtnOverlayBookingListGallery_3.PaddingRight-BtnOverlayBookingListGallery_3.PaddingLeft)
                                                            X: =lbl_BusID_1.X+lbl_BusID_1.Width
