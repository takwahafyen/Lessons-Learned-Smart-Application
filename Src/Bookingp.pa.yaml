                                                      Height: =Parent.Height
                                                      LayoutMinWidth: =60
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,11,16)
                                                      Text: ="✔️Corrective Action"
                                                      VerticalAlign: =VerticalAlign.Top
                                                      Weight: ='TextCanvas.Weight'.Bold
                                                - txtstatus_1:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      Align: ='TextCanvas.Align'.Center
                                                      BorderStyle: =BorderStyle.Solid
                                                      FillPortions: =1
                                                      Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
                                                      FontColor: =RGBA(255, 255, 255, 1)
                                                      Height: =Parent.Height
                                                      Size: =If(IsMobileLayout || IsTabletLayout ,12,16)
                                                      Text: |-
                                                        ="🔑 Category"
