                                                            Text: =ThisItem.BookingPickupLocation
                                                            Weight: ='TextCanvas.Weight'.Medium
                                                            Width: =If(IsMobileLayout || IsTabletLayout,Parent.Width/4, Parent.Width/7-BtnOverlayBookingListGallery_3.PaddingRight-BtnOverlayBookingListGallery_3.PaddingLeft)
                                                            X: =lbl_RequestorName_1.X+lbl_RequestorName_1.Width
                                                            Y: =(Parent.Height-Self.Height)/2
                                                      - lbl_BusIDNo_7:
                                                          Control: Text@0.0.51
                                                          Properties:
                                                            Align: ='TextCanvas.Align'.Center
                                                            Font: ="Trebuchet MS, Lucida Grande, Lucida Sans Unicode, Lucida Sans, sans-serif"
