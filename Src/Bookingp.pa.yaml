                      Properties:
                        Color: =RGBA(32, 32, 32, 1)
                        Height: =20
                        Icon: =Icon.Cancel
                        OnSelect: =UpdateContext({AllBookingPopup:false})
                        Width: =20
                        X: =(Parent.Width-Self.Width)/2
                        Y: =(Parent.Height-Self.Height)/2
